# Gradle 配置
# 临时文件也放到 H 盘：C 盘已经满了，NeoForm 解压时会用系统临时目录
org.gradle.jvmargs=-Xmx2G -Djava.io.tmpdir=H:/tmp-gradle
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# 26.x 的目标 JDK 比本机新，允许 Gradle 自动下载对应工具链
org.gradle.java.installations.auto-download=true

## 模组信息（各版本共用）
mod_id=betterlocate
mod_name=BetterLocate
mod_version=1.2.2
mod_group_id=com.betterlocate
mod_authors=gunmu
mod_license=MIT
mod_description=BetterLocate improves the vanilla /locate command: progress output, parallel search, visited/unvisited chunk filter, radius statistics and a custom search center. No new commands are added.

# 游戏版本相关参数（minecraft_version、neo_version、parchment 等）
# 已拆分到 versions/<游戏版本>/gradle.properties，由 Stonecutter 按节点加载。
# 想切到某个版本开发：./gradlew "Set active project to 1.21.8"
